name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (leave blank to auto-generate from commits)'
        required: false
        type: string

permissions:
  contents: write      # create GitHub releases
  id-token: write      # npm OIDC trusted publishing (no NPM_TOKEN needed)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release note generation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Check if version is already published
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view react-native-soci-auth version 2>/dev/null || echo "none")
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "published_version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION is already published — skipping."
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "New version $PACKAGE_VERSION (current: $PUBLISHED_VERSION) — will publish."
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          VERSION="${{ steps.version_check.outputs.package_version }}"
          if [ -n "$RELEASE_NOTES" ]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "$RELEASE_NOTES" \
              --latest
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes \
              --latest
          fi
