name: Deploy Demo to GitHub Pages

# NOTE: This workflow is designed for when react-native-soci-auth has its own
# repository. If it shares a repo with react-soci-auth, only one GitHub Pages
# deployment can be active at a time — adjust accordingly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build RN Demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install demo dependencies
        run: npm install

      - name: Export for web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_APPLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_APPLE_CLIENT_ID }}
          EXPO_PUBLIC_FACEBOOK_CLIENT_ID: ${{ vars.EXPO_PUBLIC_FACEBOOK_CLIENT_ID }}
          EXPO_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GITHUB_CLIENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
